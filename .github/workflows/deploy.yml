name: Deploy VR Lounge to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, Lint & Regression Tests
        run: npm run typecheck && npm run lint && npm test

      - name: Build production bundle
        env:
          VITE_LOUNGE_PASSCODE_SALT: ${{ secrets.VITE_LOUNGE_PASSCODE_SALT || vars.VITE_LOUNGE_PASSCODE_SALT || 'vr-lounge-auth-v2' }}
          VITE_LOUNGE_PASSCODE_VERIFIER: ${{ secrets.VITE_LOUNGE_PASSCODE_VERIFIER || vars.VITE_LOUNGE_PASSCODE_VERIFIER || 'e60e4d4aecf6dc515d04b9f044748049abd95ddc76f8e61f3e32775a4a172f53' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_METERED_API_KEY: ${{ secrets.VITE_METERED_API_KEY || vars.VITE_METERED_API_KEY }}
          VITE_METERED_DOMAIN: ${{ secrets.VITE_METERED_DOMAIN || vars.VITE_METERED_DOMAIN }}
          VITE_METERED_TURN_URL: ${{ secrets.VITE_METERED_TURN_URL || vars.VITE_METERED_TURN_URL }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL || vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME || vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL || vars.VITE_TURN_CREDENTIAL }}
          VITE_YOUTUBE_PROXY_URL: ${{ secrets.VITE_YOUTUBE_PROXY_URL || vars.VITE_YOUTUBE_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build && touch dist/.nojekyll

      - name: Publish dist to gh-pages branch
        run: |
          cd dist
          git init
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy VR Lounge (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
